<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- The dialogue system already ships hand/fan-translated zh/en/ja/ko text
     picked via DialogueStore (see src/core/DialogueStore.js) — Chrome's
     built-in Google Translate bar would otherwise still offer to machine-
     translate on top of that, which is worse than the authored text. -->
<meta name="google" content="notranslate">
<!-- Opts out of Android/Chrome's forced-dark auto-theming, which otherwise
     repaints the whole page (including Pixi canvases/images) with a color-
     inversion algorithm — an explicit background alone doesn't stop that. -->
<meta name="color-scheme" content="light only">
<title>Needy girl overdose fan-made website</title>
<script>
// Last-resort safety net for boot failures — registered before anything else
// in <head> so it can catch even a CDN <script> (pixi.js/lottie-web/etc.)
// failing to load over a flaky mobile connection, plus any synchronous throw
// at module top-level later (e.g. Stage construction). Without this, such a
// failure leaves #loading-screen sitting at z-index 10000 forever with zero
// on-screen explanation — exactly the "stuck on the loading screen, never
// gets in" symptom some iOS visitors report, and with no console access on a
// phone there's no way for them to tell us WHY it's stuck.
// capture:true (not just bubble) matters here specifically for <script src>
// network failures: those fire a non-bubbling 'error' Event on the <script>
// element itself, which only a capturing listener on an ancestor (window)
// ever observes — a plain bubble-phase window.onerror only sees script
// *execution* errors (e.g. "PIXI is not defined"), not the network failure
// that caused them. Must be registered before those CDN <script> tags below,
// not after — a classic (non-async/defer) <script src> blocks parsing until
// it loads-or-fails, so a listener added after it would already be too late
// to observe that particular tag's own failure.
// document.body doesn't exist yet this early (still mid-<head>), so the
// actual DOM work is deferred to DOMContentLoaded if needed.
// Gated on #loading-screen still being present at render time: every failure
// main.js's own boot() already knows how to handle (missing manifest.json,
// one bad layer) is caught locally and never reaches here; anything that
// DOES reach window while the loading screen is still up is by definition
// something boot() never got a chance to handle. Once boot() finishes and
// removes #loading-screen, this stops intercepting — runtime errors during
// actual play should just log to console as normal, not hijack the screen.
(function () {
  var shown = false;
  function render(detail) {
    if (shown) return;
    var loading = document.getElementById('loading-screen');
    if (!loading) return; // boot already succeeded — a later runtime error, not a boot failure
    shown = true;
    loading.remove();
    var el = document.createElement('div');
    el.id = 'boot-error';
    el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);' +
      'background:rgba(20,10,30,0.92);color:#ffdce8;padding:20px 28px;border-radius:12px;' +
      'font-family:monospace;font-size:13px;white-space:pre-wrap;max-width:80vw;' +
      'line-height:1.6;text-align:center;z-index:9999;';
    el.textContent = '網頁初始化失敗，請截圖回報：\n' + detail;
    document.body.appendChild(el);
  }
  function showFatalBootError(detail) {
    if (shown) return;
    if (document.body) render(detail);
    else document.addEventListener('DOMContentLoaded', function () { render(detail); }, { once: true });
  }
  window.addEventListener('error', function (e) {
    var target = e.target;
    if (target && target !== window && target.tagName) {
      showFatalBootError('資源載入失敗: ' + (target.src || target.href || target.tagName));
    } else {
      showFatalBootError((e.error && (e.error.stack || e.error.message)) || e.message || String(e));
    }
  }, true);
  // Deliberately NOT wired to showFatalBootError like the 'error' listener
  // above. First real-world iOS test of this file caught exactly why: pixi.js
  // (dist/pixi.min.js's VideoResource, wrapping eye.eyeLayer.js's <video> via
  // `PIXI.Texture.from(videoEl)`) makes its OWN internal, unguarded
  // `video.play()` call to prime the first frame — separate from and
  // unreachable by eye.eyeLayer.js's own already-present `.catch(() => {})`
  // on ITS play() call — and that internal call rejected on iOS (detached
  // <video>/autoplay-policy quirks vary by iOS version). eye.eyeLayer.js was
  // already designed to tolerate a failed video gracefully (falls back to a
  // plain window with no blink, see EyeBlinkClip.load()'s "degrades to the
  // plain window look" comment) — this rejection was harmless and silent
  // before this overlay existed. Treating every unhandled rejection as fatal
  // turned that harmless pre-existing quirk into a full page block, which is
  // strictly worse than the boot() teardown this whole file exists to guard
  // against. Left logging to console (matching pre-overlay behavior) so it's
  // still visible to anyone with real devtools access, just not blocking.
  window.addEventListener('unhandledrejection', function (e) {
    console.error('Unhandled rejection (non-fatal):', e.reason);
  });
})();
</script>
<script src="shared/device-perf.js"></script>
<script src="shared/state-sync.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pixi/gif@2.1.1/dist/pixi-gif.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-spine@4.0.6/dist/pixi-spine.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie.min.js"></script>
<link rel="stylesheet" href="shared/panel.css">
<style>
/* color-scheme here backs up the <meta name="color-scheme"> tag above for
   browsers that only honor the CSS form. Explicit white background so
   nothing shows through before any layer paints. */
:root { color-scheme: light; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }

@font-face {
  font-family: 'Silver';
  src: url('font/Silver.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: block;
}

/* Sits above everything (including #rotate-prompt's 9999) for the entire
   time assets are loading, and blocks all pointer events by simply being
   the topmost opaque element — no separate pointer-events rule needed until
   it fades out. boot() in src/main.js drives #loading-percent as each of
   manifest.json's layer entries finishes, then adds .hidden once the scene
   is fully built (layers added, GIF/animation frames synced, saved layout
   restored, click handler wired) so the very first interaction the user can
   make lands on a scene that's already fully warmed up instead of stuttering
   through late-arriving decodes. */
#loading-screen {
  position: fixed; inset: 0; z-index: 10000;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  background: linear-gradient(168deg, #ffd8ea 0%, #e8deff 48%, #d4e8ff 100%);
  transition: opacity .5s ease;
}
#loading-screen.hidden { opacity: 0; pointer-events: none; }
/* User-requested: the loading screen shows the decorative pixel cursor too
   (desktop only — pixelCursorLayer.js hides itself on mobile/touch
   regardless of this). .loading-lang-btn below keeps its own cursor:
   pointer, same "functional feedback over decorative" convention as the
   rest of the game (see index.html's #stage-area comment).
   Gated behind body.ng-cursor-ready (added by pixelCursorLayer.js once its
   iframe has actually loaded) instead of applying unconditionally: that
   iframe isn't even constructed until partway through boot()'s asset
   Promise.all, well after #loading-lang-picker is already clickable (see
   main.js's wireLoadingLangPicker) — blanking the OS cursor from the very
   first paint left users with no visible cursor at all until the decorative
   one caught up, unable to see where to click #loading-lang-picker's
   buttons. Bug report: 客製化滑鼠加載太慢，滑鼠跑出來之前根本選不了語言.
   !important: this element's own opacity is what's actively transitioning
   on hide, the same "native arrow flashes back in mid-animation" trigger
   documented at frame1Layer.js's .ng-dlg-choice-btn cursor:none. */
body.ng-cursor-ready #loading-screen { cursor: none !important; }

#loading-spinner {
  width: 54px; height: 54px; border-radius: 50%;
  border: 5px solid rgba(160,128,205,0.22);
  border-top-color: #b076c8;
  animation: loading-spin .9s linear infinite;
}
@keyframes loading-spin { to { transform: rotate(360deg); } }

#loading-label {
  font-family: 'Silver', -apple-system, sans-serif;
  font-size: 15px; letter-spacing: .12em; color: #8a6fb0; opacity: .8;
}
#loading-percent {
  font-family: 'Silver', -apple-system, sans-serif;
  font-size: 30px; letter-spacing: .04em; color: #7060a0;
}

/* The one deliberate language-choice point (see src/core/DialogueStore.js's
   detectBrowserLang) — pick here while the scene is still loading, or leave
   it alone and the browser's own reported language applies. Wired up by
   main.js's wireLoadingLangPicker (module-scope, so it's interactive the
   instant the module loads, independent of boot()'s asset Promise.all). */
#loading-lang-picker {
  display: flex; gap: 10px; margin-top: 4px;
}
.loading-lang-btn {
  font-family: 'Silver', -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size: 14px; letter-spacing: .04em; line-height: 1;
  padding: 8px 16px; border-radius: 999px;
  border: 1px solid rgba(160,128,205,0.35);
  background: rgba(255,255,255,0.5); color: #8a6fb0;
  cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease;
}
.loading-lang-btn.active { background: #b076c8; border-color: #b076c8; color: #fff; }

/* Some Chromium-based mobile browsers (Edge/Samsung Internet) force-darken
   web content even when the page opts out via color-scheme — a deliberate
   browser-side override, not something fixable from here (see index.html's
   <meta name="color-scheme">). This just tells affected users where to turn
   it off on their end. Text/lang wired by main.js's wireDarkModeHint. */
#dark-mode-hint {
  max-width: 280px; margin-top: 2px;
  font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  font-size: 11px; line-height: 1.5; letter-spacing: .02em;
  color: #8a6fb0; opacity: .6; text-align: center;
}

/* #viewport-root splits the window into two side-by-side, non-overlapping
   flex regions: #stage-area (the actual composition) and #panel (the layer
   editor). This overrides shared/panel.css's #panel/#panel-toggle rules
   (fixed-overlay, meant for a self-contained effect's OWN internal panel)
   just for this composition root — the panel here docks as a real sidebar
   instead of floating on top of the canvas.
   Every effect/layer context stacks absolute within #stage-world; z-index
   between them is coordinated at runtime by src/main.js (see reconcileZIndex). */
#viewport-root { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; }
/* cursor:none here (not on <body>) is the one bit of global coordination the
   pixelCursor effect needs from outside its own iframe: it draws its own
   8-bit cursor frontmost inside #stage-area, so the real OS pointer has to
   be hidden over that same area — but only there, so the sidebar panel keeps
   a normal, usable pointer. Elements below (e.g. drag/resize handles set by
   DragTransform.js) can still set their own inline cursor to override this,
   which is desired: functional feedback wins over the decorative cursor. */
#stage-area { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; overflow: hidden; cursor: none; }
/* #stage-world is the "camera" that screenShake.js actually moves — #stage-area
   above stays a fixed mask/viewport (overflow:hidden, never transformed), so a
   shake reads as the view into the scene moving, not the window itself
   wobbling (no seam ever opens against #panel or the browser edge). Every
   effect/layer context (Pixi canvas, DOM effect iframes, lottie, the chat/
   yandere-proto DOM overlays) lives inside this wrapper; #panel-toggle below
   is the one thing deliberately left a direct child of #stage-area instead —
   dev UI, excluded from shaking same as #panel itself.
   will-change is set here permanently (not toggled per-shake) rather than in
   screenShake.js — this subtree is heavy (Pixi's WebGL canvas plus several
   more WebGL iframes each running their own draw loop), so promoting/
   demoting its own compositing layer just-in-time for every single shake was
   itself the expensive part; paying a small constant amount of idle GPU
   memory for the life of the page avoids that. */
#stage-world, #bg-effect-layer, #pixi-stage, #lottie-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#stage-world { will-change: transform; }
#lottie-layer { pointer-events: none; }

#panel-toggle { position: absolute; top: 14px; right: 14px; }
#panel {
  position: relative;
  flex: 0 0 278px; width: 278px; height: 100%; box-sizing: border-box;
  transition: flex-basis .38s cubic-bezier(.4,0,.2,1), width .38s cubic-bezier(.4,0,.2,1);
  /* shared/panel.css's gradient is tuned ~0.64 alpha for an overlay floating
     on top of colorful content; docked as a sidebar here it only has the
     black <body> behind it, so that same alpha reads as flat gray. Almost
     opaque instead, same hues. */
  background: linear-gradient(168deg,
    rgba(255,224,240,0.97) 0%,
    rgba(236,228,255,0.97) 48%,
    rgba(220,236,255,0.97) 100%);
}
#panel.closed { flex-basis: 0; width: 0; overflow: hidden; padding: 0; transform: none; box-shadow: none; }

#popup-tuning-sec .sec { display: flex; align-items: center; justify-content: space-between; }
#popup-tuning-close {
  border: none; background: none; cursor: pointer; color: #b490cc;
  font-size: 14px; line-height: 1; padding: 0 2px;
}
#popup-tuning-close:hover { color: #8a5fb0; }

/* The layer editor is a desktop/PC workflow — on phone/tablet-width screens
   this is purely a viewer for the composed scene (and, later, in-canvas
   effect interactions), so the panel and its toggle don't show up at all
   and the stage simply fills the whole screen. Matches the same <=1024
   "mobile/tablet" cutoff shared/device-perf.js already uses. */
@media (max-width: 1024px) {
  #panel-toggle, #panel { display: none; }
}

/* Portrait: block the composed scene with a "please rotate" prompt instead
   of trying to fake landscape with a CSS rotation — a real transform would
   desync Pixi's pointer/hit-testing math from the visuals (it assumes an
   unrotated canvas). This just waits for the browser to report an actual
   landscape viewport, so nothing about the coordinate system needs to
   change at all. User-requested "當偵測到螢幕為直立(即高>寬)則顯示橫向提示"
   — keyed on orientation alone now (was additionally gated on
   `max-width: 1024px`, so a portrait window/monitor wider than that still
   fell through to the squished desktop layout instead of getting the hint). */
#rotate-prompt {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  align-items: center; justify-content: center; flex-direction: column; gap: 18px;
  background: linear-gradient(168deg, #ffd8ea 0%, #e8deff 48%, #d4e8ff 100%);
  color: #7060a0; text-align: center; padding: 24px;
  font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
#rotate-prompt .icon { font-size: 56px; animation: rotate-hint 1.6s ease-in-out infinite; }
#rotate-prompt .msg { font-size: 15px; line-height: 1.7; }
@keyframes rotate-hint {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}
@media (orientation: portrait) {
  #rotate-prompt { display: flex; }
}
</style>
</head>
<body>
<div id="rotate-prompt">
  <div class="icon">📱</div>
  <div class="msg" id="rotate-prompt-msg">請將裝置轉為橫向以獲得最佳體驗</div>
</div>
<div id="viewport-root">
  <!-- #loading-screen lives HERE (inside #viewport-root), not as a sibling
       of it — user-requested: the loading screen should show the decorative
       pixel cursor too. pixelCursorLayer.js's cursor iframe is nested deep
       inside #stage-area/#stage-world (which forks its own stacking context
       via will-change:transform), so its z-index only ever competes against
       whatever ELSE shares that same #viewport-root stacking context —
       #loading-screen has to be moved in here for its z-index to actually
       be comparable at all (a body-level sibling of #viewport-root, like
       this used to be, has its z-index compared against #viewport-root as a
       SINGLE UNIT, not against anything nested inside it — see
       pixelCursorLayer.js's FRONTMOST_Z comment for the full explanation;
       the same trap phoneCallOverlay.js/chat.chatboardLayer.js's compose
       modal hit). position:fixed here still centers on the real viewport
       either way — #viewport-root has no transform/filter/will-change of
       its own to redefine the containing block for it. -->
  <div id="loading-screen">
    <div id="loading-spinner"></div>
    <div id="loading-label">LOADING</div>
    <div id="loading-percent">0%</div>
    <div id="loading-lang-picker">
      <button type="button" class="loading-lang-btn" data-lang="zh">中文</button>
      <button type="button" class="loading-lang-btn" data-lang="en">EN</button>
      <button type="button" class="loading-lang-btn" data-lang="ja">日本語</button>
      <button type="button" class="loading-lang-btn" data-lang="ko">한국어</button>
    </div>
    <div id="dark-mode-hint"></div>
  </div>
  <div id="stage-area">
    <div id="stage-world">
      <div id="bg-effect-layer"></div>   <!-- self-contained effect pages, e.g. UI/holographic -->
      <div id="pixi-stage"></div>        <!-- Pixi.js image layers -->
      <div id="lottie-layer"></div>      <!-- lottie-web layer -->
    </div>
    <button id="panel-toggle" title="Layers">⚙</button>
  </div>

  <div id="panel" class="closed">
    <div class="sec">Layers</div>
    <div id="layer-panel-mount"></div>
    <div class="btn-row">
      <button class="pbtn" id="layer-save-btn">💾 Save Layout</button>
      <button class="pbtn" id="layer-reset-btn">↺ Reset</button>
    </div>
    <div id="popup-tuning-sec">
      <div class="sec">Popup Face Align <button id="popup-tuning-close" title="Close">×</button></div>
      <div id="popup-tuning-mount"></div>
    </div>
    <div class="div"></div>
    <div id="stat-debug-sec">
      <div class="sec">Stat Debug (StatStore)</div>
      <div id="stat-debug-mount"></div>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
